name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "true"
      SECRET_KEY: ci-only-secret-key-ci-only-secret-key-ci-only-secret-key
      CREDENTIAL_ENCRYPTION_KEY: ci-only-credential-key-ci-only-credential-key
      DATABASE_URL: mysql+pymysql://user:pass@127.0.0.1/ungozu_rdp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: alembic upgrade head --sql > /tmp/rdp-migration.sql
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      BACKEND_URL: http://127.0.0.1:8010
      NEXT_PUBLIC_SITE_URL: https://rdp.example.test
      NEXT_PUBLIC_MAIN_SITE_URL: https://example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
